<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TSi – Additional Sign Requests</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --tsi-blue: #2A7A2A;
      --tsi-gold: #1A1A1A;
      --tsi-light: #F5F5F5;
      --tsi-border: #D0D0D0;
      --tsi-text: #1A1A1A;
      --tsi-muted: #666666;
      --tsi-green: #2A7A2A;
      --tsi-green-light: #E6F5E6;
      --tsi-red: #C0392B;
      --radius: 8px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--tsi-light);
      color: var(--tsi-text);
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: var(--tsi-blue);
      color: #fff;
      padding: 0 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      height: 64px;
      box-shadow: 0 2px 8px rgba(0,0,0,.25);
    }
    header .logo {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: .05em;
      color: #fff;
    }
    header .title {
      font-size: 1rem;
      opacity: .85;
    }

    /* ── Layout ── */
    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 32px 16px 64px;
    }

    .card {
      background: #fff;
      border: 1px solid var(--tsi-border);
      border-radius: var(--radius);
      padding: 28px;
      margin-bottom: 24px;
      box-shadow: 0 1px 4px rgba(0,0,0,.06);
    }

    h2 {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--tsi-green);
      margin-bottom: 18px;
      padding-bottom: 10px;
      border-bottom: 2px solid #1A1A1A;
      display: inline-block;
    }

    /* ── Tabs (manager only) ── */
    .tabs {
      display: flex;
      gap: 4px;
      margin-bottom: 24px;
    }
    .tab-btn {
      padding: 9px 20px;
      border: 1px solid var(--tsi-border);
      border-radius: var(--radius) var(--radius) 0 0;
      background: #fff;
      cursor: pointer;
      font-size: .9rem;
      font-weight: 600;
      color: var(--tsi-muted);
      border-bottom: none;
      transition: color .15s, background .15s;
    }
    .tab-btn.active {
      background: #1A1A1A;
      color: #fff;
      border-color: #1A1A1A;
    }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* ── Form elements ── */
    label {
      display: block;
      font-size: .85rem;
      font-weight: 600;
      color: var(--tsi-muted);
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    input[type="text"], input[type="number"], select, textarea {
      width: 100%;
      padding: 9px 12px;
      border: 1px solid var(--tsi-border);
      border-radius: var(--radius);
      font-size: .95rem;
      color: var(--tsi-text);
      background: #fff;
      transition: border-color .15s;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--tsi-blue);
      box-shadow: 0 0 0 3px rgba(0,56,101,.12);
    }
    .field { margin-bottom: 16px; }
    .field-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    @media (max-width: 560px) { .field-row { grid-template-columns: 1fr; } }

    /* ── Buttons ── */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 20px;
      border-radius: var(--radius);
      border: none;
      font-size: .9rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity .15s, transform .1s;
    }
    .btn:active { transform: scale(.98); }
    .btn-primary { background: var(--tsi-blue); color: #fff; }
    .btn-primary:hover { opacity: .88; }
    .btn-gold { background: #1A1A1A; color: #fff; }
    .btn-gold:hover { opacity: .88; }
    .btn-sm { padding: 6px 12px; font-size: .8rem; }
    .btn-outline {
      background: transparent;
      border: 1px solid var(--tsi-border);
      color: var(--tsi-text);
    }
    .btn-outline:hover { border-color: var(--tsi-blue); color: var(--tsi-blue); }
    .btn-danger { background: var(--tsi-red); color: #fff; }

    /* ── Shareable link box ── */
    .link-box {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }
    .link-box input {
      flex: 1;
      font-family: monospace;
      font-size: .85rem;
      background: var(--tsi-light);
    }
    .copy-feedback {
      font-size: .8rem;
      color: var(--tsi-green);
      margin-top: 6px;
      display: none;
    }

    /* ── Signs table ── */
    .signs-table-wrap { overflow-x: auto; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: .88rem;
    }
    th {
      text-align: left;
      padding: 8px 10px;
      background: var(--tsi-blue);
      color: #fff;
      font-size: .8rem;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    td {
      padding: 9px 10px;
      border-bottom: 1px solid var(--tsi-border);
      vertical-align: middle;
      word-break: break-word;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--tsi-light); }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 20px;
      font-size: .75rem;
      font-weight: 700;
    }
    .badge-pending { background: #FFF3CD; color: #856404; }
    .badge-done { background: var(--tsi-green-light); color: var(--tsi-green); }

    /* ── Sign entry rows (client form) ── */
    .sign-rows { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
    .sign-row {
      display: grid;
      grid-template-columns: 1fr 90px 36px;
      gap: 8px;
      align-items: start;
    }
    .sign-row textarea {
      resize: none;
      overflow: hidden;
      min-height: 38px;
      line-height: 1.4;
      padding: 8px 12px;
    }
    .sign-row input[type="number"] { text-align: center; }
    .remove-row {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--tsi-muted);
      font-size: 1.1rem;
      line-height: 1;
      padding: 4px;
      border-radius: 4px;
    }
    .remove-row:hover { color: var(--tsi-red); background: #fdecea; }

    /* ── Previous signs list (client read-only) ── */
    .prev-sign {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid var(--tsi-border);
    }
    .prev-sign:last-child { border-bottom: none; }
    .prev-sign-desc { font-weight: 600; word-break: break-word; }
    .prev-sign-meta { font-size: .8rem; color: var(--tsi-muted); }
    .prev-sign-qty {
      font-size: .85rem;
      font-weight: 700;
      color: var(--tsi-blue);
      white-space: nowrap;
    }

    /* ── Alerts / messages ── */
    .alert {
      padding: 12px 16px;
      border-radius: var(--radius);
      font-size: .9rem;
      margin-bottom: 16px;
    }
    .alert-success { background: var(--tsi-green-light); color: var(--tsi-green); border: 1px solid #a8d5bc; }
    .alert-error { background: #FDECEA; color: var(--tsi-red); border: 1px solid #f5c6c2; }
    .alert-info { background: #E6F5E6; color: #2A7A2A; border: 1px solid #a8d5a8; }

    /* ── Spinner ── */
    .spinner {
      display: inline-block;
      width: 18px; height: 18px;
      border: 2px solid rgba(255,255,255,.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin .6s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Prefixed invoice input ── */
    .inv-input-wrap {
      display: flex;
      align-items: stretch;
      border: 1px solid var(--tsi-border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .inv-input-wrap:focus-within {
      border-color: var(--tsi-blue);
      box-shadow: 0 0 0 3px rgba(42,122,42,.12);
    }
    .inv-prefix {
      background: var(--tsi-light);
      border-right: 1px solid var(--tsi-border);
      padding: 9px 10px;
      font-weight: 700;
      font-size: .95rem;
      color: var(--tsi-muted);
      user-select: none;
      white-space: nowrap;
    }
    .inv-input-wrap input {
      border: none;
      border-radius: 0;
      box-shadow: none !important;
      flex: 1;
      min-width: 0;
    }
    .inv-input-wrap input:focus { outline: none; box-shadow: none; }
    /* Hide number input spinners */
    .inv-input-wrap input::-webkit-outer-spin-button,
    .inv-input-wrap input::-webkit-inner-spin-button { -webkit-appearance: none; }
    .inv-input-wrap input[type=number] { -moz-appearance: textfield; }

    /* ── Past invoice list rows ── */
    .invoice-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid var(--tsi-border);
      flex-wrap: wrap;
    }
    .invoice-row:last-child { border-bottom: none; }
    .invoice-row-info { flex: 1; min-width: 0; }
    .invoice-row-id { font-weight: 700; font-size: .9rem; }
    .invoice-row-event { font-size: .82rem; color: var(--tsi-muted); margin-top: 2px; }
    .invoice-row-actions { display: flex; gap: 6px; flex-shrink: 0; flex-wrap: wrap; }
    .invoice-row .delete-row-btn { display: none; }
    .invoice-list-edit-mode .delete-row-btn { display: inline-flex !important; }
    .edit-mode-btn-active { background: #1A1A1A !important; color: #fff !important; border-color: #1A1A1A !important; }

    /* ── Invoice selector (manager tab 2) ── */
    .invoice-selector { display: flex; gap: 10px; align-items: flex-end; margin-bottom: 20px; }
    .invoice-selector .field { margin-bottom: 0; flex: 1; }
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--tsi-muted);
      font-size: .9rem;
    }

    /* ── Progress bar ── */
    .progress-bar {
      height: 4px;
      background: var(--tsi-border);
      border-radius: 2px;
      margin-bottom: 20px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: #1A1A1A;
      transition: width .4s ease;
    }

    /* ── Event banner ── */
    .event-banner {
      background: var(--tsi-blue);
      color: #fff;
      border-radius: var(--radius);
      padding: 20px 24px;
      margin-bottom: 24px;
    }
    .event-banner .label { font-size: .75rem; opacity: .7; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 4px; }
    .event-banner .event-name { font-size: 1.4rem; font-weight: 800; }
    .event-banner .invoice-num { font-size: .85rem; opacity: .75; margin-top: 4px; }

    /* ── Confirmation overlay ── */
    .confirmation {
      text-align: center;
      padding: 40px 20px;
    }
    .confirmation .check-icon {
      font-size: 3.5rem;
      margin-bottom: 16px;
    }
    .confirmation h3 { font-size: 1.3rem; color: var(--tsi-green); margin-bottom: 8px; }
    .confirmation p { color: var(--tsi-muted); margin-bottom: 20px; }
  </style>
</head>
<body>

<header>
  <span class="logo">TSi</span>
  <span class="title">Additional Sign Requests</span>
</header>

<main id="app"><!-- Rendered by JS --></main>

<script>
// ---------------------------------------------------------------------------
// Routing: detect manager vs client view
// ---------------------------------------------------------------------------
const params = new URLSearchParams(location.search);
const invoiceParam = params.get('invoice');
const eventParam   = params.get('event');
const isClientView = !!(invoiceParam && eventParam);

// ---------------------------------------------------------------------------
// Utility helpers
// ---------------------------------------------------------------------------
const $ = id => document.getElementById(id);
const el = (tag, attrs = {}, ...children) => {
  const e = document.createElement(tag);
  Object.entries(attrs).forEach(([k, v]) => {
    if (k === 'class') e.className = v;
    else if (k === 'style') e.style.cssText = v;
    else e[k] = v;
  });
  children.forEach(c => typeof c === 'string' ? e.append(c) : c && e.append(c));
  return e;
};

function fmtDate(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleString('en-US', { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' });
}

async function api(method, path, body) {
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(path, opts);
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || 'Server error');
  return data;
}

// ---------------------------------------------------------------------------
// Manager View
// ---------------------------------------------------------------------------
function renderManagerView() {
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('generate')">Generate Link</button>
      <button class="tab-btn" onclick="switchTab('review')">Review Submissions</button>
    </div>

    <!-- Tab 1: Generate link -->
    <div id="tab-generate" class="tab-panel active">
      <div class="card">
        <h2>Create Client Link</h2>
        <div id="gen-alert"></div>
        <div class="field-row">
          <div class="field">
            <label for="inv-num">Invoice ID</label>
            <div class="inv-input-wrap">
              <span class="inv-prefix">INV-</span>
              <input type="number" id="inv-num" placeholder="12345" min="1"
                max="99999" step="1" oninput="clearDuplicateWarning()" />
            </div>
          </div>
          <div class="field">
            <label for="evt-name">Event Name</label>
            <input type="text" id="evt-name" placeholder="e.g. Smith Wedding" />
          </div>
        </div>
        <button class="btn btn-primary" onclick="generateLink()">
          Generate Shareable Link
        </button>

        <div id="link-result" style="display:none; margin-top:20px;">
          <label>Shareable Client Link</label>
          <div class="link-box">
            <input type="text" id="share-link" readonly />
            <button class="btn btn-gold btn-sm" onclick="copyLink('share-link','copy-feedback')">Copy</button>
          </div>
          <div class="copy-feedback" id="copy-feedback">Copied to clipboard!</div>
        </div>
      </div>

      <!-- Past invoices / link lookup -->
      <div class="card">
        <h2>Past Invoices</h2>
        <div style="margin-bottom:14px; display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
          <input type="text" id="inv-search" placeholder="Search by invoice ID or event name…"
            oninput="filterInvoiceList()" style="max-width:300px; flex:1;" />
          <button class="btn btn-outline btn-sm" onclick="loadInvoiceList()">↻ Refresh</button>
          <button class="btn btn-outline btn-sm" id="edit-mode-btn" onclick="toggleEditMode()">Edit</button>
        </div>
        <div id="invoice-list"><div class="empty-state">Loading…</div></div>
      </div>

      <!-- Delete confirmation modal -->
      <div id="delete-modal-backdrop" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:100; align-items:center; justify-content:center;">
        <div style="background:#fff; border-radius:var(--radius); padding:28px 28px 22px; max-width:400px; width:90%; box-shadow:0 8px 32px rgba(0,0,0,.25);">
          <div style="font-size:1.05rem; font-weight:700; color:var(--tsi-red); margin-bottom:10px;">Delete Invoice?</div>
          <div id="delete-modal-msg" style="font-size:.9rem; color:var(--tsi-text); margin-bottom:20px;"></div>
          <div style="display:flex; gap:10px; justify-content:flex-end;">
            <button class="btn btn-outline" onclick="closeDeleteModal()">Cancel</button>
            <button class="btn btn-danger" id="delete-modal-confirm">Yes, Delete</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Tab 2: Review submissions -->
    <div id="tab-review" class="tab-panel">
      <div class="card">
        <h2>Review Submissions</h2>
        <div class="invoice-selector">
          <div class="field">
            <label for="inv-select">Select Invoice</label>
            <select id="inv-select" onchange="loadSignsForInvoice()">
              <option value="">— select invoice —</option>
            </select>
          </div>
          <button class="btn btn-outline btn-sm" onclick="loadInvoices()">↻ Refresh</button>
        </div>
        <div id="review-content">
          <div class="empty-state">Select an invoice above to view submissions.</div>
        </div>
      </div>
    </div>
  `;
  loadInvoices(); // populates dropdown + past invoices list
}

function switchTab(name) {
  document.querySelectorAll('.tab-btn').forEach((b, i) => {
    b.classList.toggle('active', ['generate','review'][i] === name);
  });
  document.querySelectorAll('.tab-panel').forEach(p => {
    p.classList.toggle('active', p.id === `tab-${name}`);
  });
}

// Cache of all invoices for duplicate checking and list filtering
let allInvoices = [];

function getInvoiceId() {
  const num = $('inv-num').value.trim();
  if (!num) return '';
  const n = parseInt(num, 10);
  if (isNaN(n) || n < 1 || n > 99999) return '';
  return `INV-${n}`;
}

async function generateLink() {
  const invoiceId = getInvoiceId();
  const eventName = $('evt-name').value.trim();
  const alertEl = $('gen-alert');

  if (!invoiceId) {
    alertEl.innerHTML = '<div class="alert alert-error">Please enter a valid 1–5 digit invoice number.</div>';
    return;
  }
  if (!eventName) {
    alertEl.innerHTML = '<div class="alert alert-error">Please enter an Event Name.</div>';
    return;
  }

  // Check for duplicate before hitting the server
  const duplicate = allInvoices.find(inv => inv.invoiceId === invoiceId);
  if (duplicate) {
    const existingLink = buildClientUrl(duplicate.invoiceId, duplicate.eventName);
    alertEl.innerHTML = `
      <div class="alert alert-error">
        <strong>Invoice ID "${escHtml(invoiceId)}" already exists</strong> (${escHtml(duplicate.eventName)}).<br>
        <span style="font-size:.85rem;">Use the existing link below, or choose a different Invoice ID.</span>
      </div>`;
    $('share-link').value = existingLink;
    $('link-result').style.display = 'block';
    return;
  }

  try {
    await api('POST', '/api/invoices', { invoiceId, eventName });
    const linkUrl = buildClientUrl(invoiceId, eventName);
    $('share-link').value = linkUrl;
    $('link-result').style.display = 'block';
    alertEl.innerHTML = '<div class="alert alert-success">Invoice saved. Share the link below with your client.</div>';
    // Refresh both the list and the review dropdown
    await loadInvoices();
  } catch (err) {
    alertEl.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
  }
}

function clearDuplicateWarning() {
  const alertEl = $('gen-alert');
  if (alertEl) {
    alertEl.innerHTML = '';
    $('link-result').style.display = 'none';
  }
}

function buildClientUrl(invoiceId, eventName) {
  return `${location.origin}${location.pathname}?invoice=${encodeURIComponent(invoiceId)}&event=${encodeURIComponent(eventName)}`;
}

function copyLink(inputId, feedbackId) {
  const val = $(inputId).value;
  navigator.clipboard.writeText(val).then(() => {
    const fb = $(feedbackId);
    fb.style.display = 'block';
    setTimeout(() => fb.style.display = 'none', 2000);
  });
}

async function loadInvoices() {
  try {
    allInvoices = await api('GET', '/api/invoices');

    // Populate the review tab dropdown
    const sel = $('inv-select');
    if (sel) {
      const prev = sel.value;
      sel.innerHTML = '<option value="">— select invoice —</option>';
      allInvoices.forEach(inv => {
        const opt = document.createElement('option');
        opt.value = inv.invoiceId;
        opt.dataset.event = inv.eventName;
        opt.textContent = `${inv.invoiceId} – ${inv.eventName}`;
        sel.append(opt);
      });
      if (prev) sel.value = prev;
    }

    // Refresh the past invoices list on tab 1
    renderInvoiceList(allInvoices);
  } catch (err) {
    console.error('Failed to load invoices:', err);
  }
}

async function loadInvoiceList() {
  await loadInvoices();
}

function filterInvoiceList() {
  const q = ($('inv-search').value || '').toLowerCase();
  const filtered = q
    ? allInvoices.filter(inv =>
        inv.invoiceId.toLowerCase().includes(q) ||
        inv.eventName.toLowerCase().includes(q))
    : allInvoices;
  renderInvoiceList(filtered, q);
}

function renderInvoiceList(invoices, highlight = '') {
  const container = $('invoice-list');
  if (!container) return;
  if (invoices.length === 0) {
    container.innerHTML = highlight
      ? '<div class="empty-state">No invoices match your search.</div>'
      : '<div class="empty-state">No invoices yet — generate one above.</div>';
    return;
  }

  container.innerHTML = '';
  invoices.forEach((inv, i) => {
    const linkUrl = buildClientUrl(inv.invoiceId, inv.eventName);
    const feedbackId = `inv-copy-fb-${i}`;
    const inputId = `inv-link-${i}`;

    const row = el('div', { class: 'invoice-row' });
    row.innerHTML = `
      <div class="invoice-row-info">
        <div class="invoice-row-id">${escHtml(inv.invoiceId)}</div>
        <div class="invoice-row-event">${escHtml(inv.eventName)}</div>
      </div>
      <div class="invoice-row-actions">
        <input type="text" id="${inputId}" value="${escAttr(linkUrl)}" readonly
          style="width:0;height:0;opacity:0;position:absolute;pointer-events:none;" />
        <button class="btn btn-outline btn-sm" onclick="copyLink('${inputId}','${feedbackId}')">Copy Link</button>
        <button class="btn btn-primary btn-sm"
          onclick="switchTab('review'); document.getElementById('inv-select').value='${escAttr(inv.invoiceId)}'; loadSignsForInvoice();">
          View
        </button>
        <button class="btn btn-danger btn-sm delete-row-btn"
          onclick="confirmDeleteInvoice('${escAttr(inv.invoiceId)}', '${escAttr(inv.eventName)}')">
          Delete
        </button>
      </div>
      <div style="width:100%;">
        <div class="copy-feedback" id="${feedbackId}">Copied to clipboard!</div>
      </div>
    `;
    container.append(row);
  });
}

let editModeActive = false;

function toggleEditMode() {
  editModeActive = !editModeActive;
  const list = $('invoice-list');
  const btn  = $('edit-mode-btn');
  if (editModeActive) {
    list.classList.add('invoice-list-edit-mode');
    btn.textContent = 'Done';
    btn.classList.add('edit-mode-btn-active');
  } else {
    list.classList.remove('invoice-list-edit-mode');
    btn.textContent = 'Edit';
    btn.classList.remove('edit-mode-btn-active');
  }
}

function confirmDeleteInvoice(invoiceId, eventName) {
  const backdrop = $('delete-modal-backdrop');
  const msg      = $('delete-modal-msg');
  const confirmBtn = $('delete-modal-confirm');

  msg.innerHTML = `This will permanently delete invoice <strong>${escHtml(invoiceId)}</strong> (${escHtml(eventName)}) and all of its sign records. This cannot be undone.`;
  backdrop.style.display = 'flex';

  // Replace the confirm button to clear any previous onclick
  const fresh = confirmBtn.cloneNode(true);
  fresh.onclick = async () => {
    closeDeleteModal();
    try {
      await api('DELETE', `/api/invoices/${encodeURIComponent(invoiceId)}`);
      await loadInvoices();
      // Keep edit mode on after deletion so the manager can delete more
      if (editModeActive) {
        $('invoice-list').classList.add('invoice-list-edit-mode');
      }
    } catch (err) {
      alert('Failed to delete: ' + err.message);
    }
  };
  confirmBtn.replaceWith(fresh);
}

function closeDeleteModal() {
  $('delete-modal-backdrop').style.display = 'none';
}

// Close modal on backdrop click
document.addEventListener('click', e => {
  const backdrop = $('delete-modal-backdrop');
  if (backdrop && e.target === backdrop) closeDeleteModal();
});

async function loadSignsForInvoice() {
  const sel = $('inv-select');
  const invoiceId = sel.value;
  const content = $('review-content');

  if (!invoiceId) {
    content.innerHTML = '<div class="empty-state">Select an invoice above to view submissions.</div>';
    return;
  }

  content.innerHTML = '<div class="empty-state">Loading…</div>';

  try {
    const signs = await api('GET', `/api/signs?invoice=${encodeURIComponent(invoiceId)}`);
    renderSignsTable(signs, content, invoiceId);
  } catch (err) {
    content.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
  }
}

function renderSignsTable(signs, container, invoiceId) {
  if (signs.length === 0) {
    container.innerHTML = '<div class="empty-state">No signs submitted yet for this invoice.</div>';
    return;
  }

  const added = signs.filter(s => s.addedToSystem).length;
  const pct = Math.round((added / signs.length) * 100);

  const wrap = el('div');
  wrap.innerHTML = `
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
      <span style="font-size:.85rem; color:var(--tsi-muted);">${added} of ${signs.length} added to system</span>
      <span style="font-size:.85rem; font-weight:700; color:var(--tsi-blue);">${pct}%</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
  `;

  const tableWrap = el('div', { class: 'signs-table-wrap' });
  const table = el('table');
  table.innerHTML = `
    <thead>
      <tr>
        <th>Description</th>
        <th>Qty</th>
        <th>Submitted By</th>
        <th>Submitted</th>
        <th>Status</th>
        <th style="text-align:center;">Added to System</th>
      </tr>
    </thead>
  `;

  const tbody = el('tbody');
  signs.forEach(sign => {
    const tr = el('tr');
    tr.innerHTML = `
      <td>${escHtml(sign.description)}</td>
      <td style="text-align:center; font-weight:700;">${sign.quantity}</td>
      <td style="white-space:nowrap;">${sign.submittedBy ? escHtml(sign.submittedBy) : '<span style="color:var(--tsi-muted);">—</span>'}</td>
      <td style="white-space:nowrap;">${fmtDate(sign.submittedAt)}</td>
      <td>
        <span class="badge ${sign.addedToSystem ? 'badge-done' : 'badge-pending'}">
          ${sign.addedToSystem ? 'Added' : 'Pending'}
        </span>
      </td>
      <td style="text-align:center;">
        <input type="checkbox" ${sign.addedToSystem ? 'checked' : ''}
          style="width:18px;height:18px;cursor:pointer;"
          onchange="toggleAdded(this, ${sign.id}, '${escAttr(invoiceId)}')" />
      </td>
    `;
    tbody.append(tr);
  });

  table.append(tbody);
  tableWrap.append(table);
  wrap.append(tableWrap);
  container.innerHTML = '';
  container.append(wrap);
}

async function toggleAdded(checkbox, rowIndex, invoiceId) {
  const addedToSystem = checkbox.checked;
  try {
    await api('PATCH', `/api/signs/${rowIndex}`, { addedToSystem });
    // Refresh the table
    const signs = await api('GET', `/api/signs?invoice=${encodeURIComponent(invoiceId)}`);
    renderSignsTable(signs, $('review-content'), invoiceId);
  } catch (err) {
    checkbox.checked = !addedToSystem; // revert
    alert('Failed to update: ' + err.message);
  }
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escAttr(s) {
  return String(s).replace(/'/g, '&#39;').replace(/"/g, '&quot;');
}

// ---------------------------------------------------------------------------
// Client View
// ---------------------------------------------------------------------------
let signRowCount = 0;

function renderClientView() {
  const app = document.getElementById('app');
  const eventName = decodeURIComponent(eventParam);
  const invoiceId = decodeURIComponent(invoiceParam);

  app.innerHTML = `
    <div class="event-banner">
      <div class="label">Event</div>
      <div class="event-name">${escHtml(eventName)}</div>
      <div class="invoice-num">Invoice: ${escHtml(invoiceId)}</div>
    </div>

    <!-- Previously submitted signs -->
    <div class="card" id="prev-card">
      <h2>Previously Submitted Signs</h2>
      <div id="prev-list"><div class="empty-state">Loading…</div></div>
    </div>

    <!-- New sign submission form -->
    <div class="card" id="form-card">
      <h2>Submit Additional Signs</h2>
      <div id="form-alert"></div>

      <div class="field-row" style="margin-bottom:16px;">
        <div class="field" style="margin-bottom:0;">
          <label for="submitter-first">First Name <span style="color:var(--tsi-red);">*</span></label>
          <input type="text" id="submitter-first" placeholder="First name" autocomplete="given-name" />
        </div>
        <div class="field" style="margin-bottom:0;">
          <label for="submitter-last">Last Name <span style="color:var(--tsi-red);">*</span></label>
          <input type="text" id="submitter-last" placeholder="Last name" autocomplete="family-name" />
        </div>
      </div>

      <div style="display:grid; grid-template-columns: 1fr 90px; gap:8px; margin-bottom:8px; padding:0 44px 0 0;">
        <label style="margin:0; color:var(--tsi-muted);">Sign Description</label>
        <label style="margin:0; color:var(--tsi-muted); text-align:center;">Qty</label>
      </div>

      <div class="sign-rows" id="sign-rows"></div>

      <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
        <button class="btn btn-outline btn-sm" onclick="addSignRow()">+ Add Row</button>
        <span id="row-count-label" style="font-size:.8rem; color:var(--tsi-muted);"></span>
      </div>

      <div style="margin-top:20px; display:flex; gap:12px; align-items:center; flex-wrap:wrap;">
        <button class="btn btn-primary" id="submit-btn" onclick="submitSigns()">
          Submit Signs
        </button>
        <span id="submit-status" style="font-size:.85rem; color:var(--tsi-muted);"></span>
      </div>
    </div>
  `;

  loadPreviousSigns(invoiceId, eventName);
  addSignRow(); // start with 1 row
}

async function loadPreviousSigns(invoiceId, eventName) {
  const list = $('prev-list');
  try {
    const signs = await api('GET', `/api/signs?invoice=${encodeURIComponent(invoiceId)}`);
    if (signs.length === 0) {
      list.innerHTML = '<div class="empty-state" style="padding:20px 0 0;">No signs submitted yet — be the first!</div>';
      return;
    }
    list.innerHTML = '';
    signs.forEach(sign => {
      const div = el('div', { class: 'prev-sign' });
      div.innerHTML = `
        <div>
          <div class="prev-sign-desc">${escHtml(sign.description)}</div>
          <div class="prev-sign-meta">Submitted ${fmtDate(sign.submittedAt)}</div>
        </div>
        <div style="display:flex;align-items:center;gap:10px;flex-shrink:0;">
          <span class="prev-sign-qty">Qty: ${sign.quantity}</span>
          <span class="badge ${sign.addedToSystem ? 'badge-done' : 'badge-pending'}">
            ${sign.addedToSystem ? 'Added to System' : 'Pending'}
          </span>
        </div>
      `;
      list.append(div);
    });
  } catch (err) {
    list.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
  }
}

function addSignRow() {
  if (signRowCount >= 100) return;
  signRowCount++;

  const rows = $('sign-rows');
  const rowId = `row-${signRowCount}`;
  const div = el('div', { class: 'sign-row', id: rowId });
  div.innerHTML = `
    <textarea rows="1" placeholder="Sign description" class="sign-desc"
      aria-label="Sign description ${signRowCount}"></textarea>
    <input type="number" value="1" min="1" max="9999" class="sign-qty"
      aria-label="Quantity ${signRowCount}" />
    <button class="remove-row" onclick="removeSignRow('${rowId}')" title="Remove row">×</button>
  `;
  rows.append(div);

  // Auto-resize textarea as user types
  const ta = div.querySelector('.sign-desc');
  ta.addEventListener('input', () => {
    ta.style.height = 'auto';
    ta.style.height = ta.scrollHeight + 'px';
  });

  updateRowCountLabel();
  ta.focus();
}

function removeSignRow(rowId) {
  const row = $(rowId);
  if (row) {
    row.remove();
    signRowCount = Math.max(0, signRowCount - 1);
    updateRowCountLabel();
  }
}

function updateRowCountLabel() {
  const label = $('row-count-label');
  const actual = $('sign-rows').querySelectorAll('.sign-row').length;
  if (actual >= 100) {
    label.textContent = 'Maximum 100 rows reached.';
  } else {
    label.textContent = `${actual} row${actual !== 1 ? 's' : ''}`;
  }
}

async function submitSigns() {
  const invoiceId = decodeURIComponent(invoiceParam);
  const eventName = decodeURIComponent(eventParam);
  const alertEl = $('form-alert');
  const btn = $('submit-btn');

  const firstName = ($('submitter-first').value || '').trim();
  const lastName  = ($('submitter-last').value  || '').trim();
  if (!firstName || !lastName) {
    alertEl.innerHTML = '<div class="alert alert-error">Please enter your first and last name before submitting.</div>';
    return;
  }
  const submittedBy = `${firstName} ${lastName}`;

  const rows = $('sign-rows').querySelectorAll('.sign-row');
  const signs = [];
  rows.forEach(row => {
    const desc = row.querySelector('.sign-desc').value.trim();
    const qty  = parseInt(row.querySelector('.sign-qty').value, 10) || 1;
    if (desc) signs.push({ description: desc, quantity: qty });
  });

  if (signs.length === 0) {
    alertEl.innerHTML = '<div class="alert alert-error">Please enter at least one sign description.</div>';
    return;
  }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Submitting…';
  alertEl.innerHTML = '';

  try {
    const result = await api('POST', '/api/signs', { invoiceId, eventName, signs, submittedBy });
    showConfirmation(result.saved, invoiceId, eventName);
  } catch (err) {
    alertEl.innerHTML = `<div class="alert alert-error">${err.message}</div>`;
    btn.disabled = false;
    btn.innerHTML = 'Submit Signs';
  }
}

function showConfirmation(count, invoiceId, eventName) {
  const formCard = $('form-card');
  formCard.innerHTML = `
    <div class="confirmation">
      <div class="check-icon">✅</div>
      <h3>Signs Submitted!</h3>
      <p>${count} sign${count !== 1 ? 's' : ''} have been submitted for <strong>${escHtml(eventName)}</strong>.<br>
      Our team will review them and add them to your order.</p>
      <button class="btn btn-primary" onclick="addMoreSigns()">Submit More Signs</button>
    </div>
  `;
  // Refresh the previous signs list
  loadPreviousSigns(invoiceId, eventName);
}

function addMoreSigns() {
  signRowCount = 0;
  const invoiceId = decodeURIComponent(invoiceParam);
  const eventName = decodeURIComponent(eventParam);

  const formCard = $('form-card');
  formCard.innerHTML = `
    <h2>Submit Additional Signs</h2>
    <div id="form-alert"></div>
    <div class="field-row" style="margin-bottom:16px;">
      <div class="field" style="margin-bottom:0;">
        <label for="submitter-first">First Name <span style="color:var(--tsi-red);">*</span></label>
        <input type="text" id="submitter-first" placeholder="First name" autocomplete="given-name" />
      </div>
      <div class="field" style="margin-bottom:0;">
        <label for="submitter-last">Last Name <span style="color:var(--tsi-red);">*</span></label>
        <input type="text" id="submitter-last" placeholder="Last name" autocomplete="family-name" />
      </div>
    </div>
    <div style="display:grid; grid-template-columns: 1fr 90px; gap:8px; margin-bottom:8px; padding:0 44px 0 0;">
      <label style="margin:0; color:var(--tsi-muted);">Sign Description</label>
      <label style="margin:0; color:var(--tsi-muted); text-align:center;">Qty</label>
    </div>
    <div class="sign-rows" id="sign-rows"></div>
    <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
      <button class="btn btn-outline btn-sm" onclick="addSignRow()">+ Add Row</button>
      <span id="row-count-label" style="font-size:.8rem; color:var(--tsi-muted);"></span>
    </div>
    <div style="margin-top:20px; display:flex; gap:12px; align-items:center; flex-wrap:wrap;">
      <button class="btn btn-primary" id="submit-btn" onclick="submitSigns()">Submit Signs</button>
      <span id="submit-status" style="font-size:.85rem; color:var(--tsi-muted);"></span>
    </div>
  `;
  addSignRow();
}

// ---------------------------------------------------------------------------
// Boot
// ---------------------------------------------------------------------------
if (isClientView) {
  renderClientView();
} else {
  renderManagerView();
}
</script>
</body>
</html>
